[package]
name = "dsa-ml"
version = "0.1.0"
edition = "2021"

[dependencies]
pqcrypto-dilithium = "0.5.0"
axum = "0.8.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
subtle = "2.5.0"
dotenv = "0.15"
pqcrypto-traits = "0.3.5"
rand = "0.8"
chrono = "0.4.42"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tokio-test = "0.4"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "integration_test"
path = "src/bin/integration_test.rs"